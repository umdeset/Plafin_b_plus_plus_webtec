<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="login.css" rel="stylesheet">
    <script src="login.js" type="module"></script>
</head>
<body>

<div id="login-container" class="login-container">
    <h1>Welcome Back</h1>

    <!-- Notice the method="POST" and action="/login".
         This is where your HTML talks to your backend Node.js code! -->
    <form id="loginForm">

        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>

        </div>

        <button type="submit" class="btn btn-login">Login</button>
        <button id="registerBtn" type="button" class="btn btn-register">Create an Account</button>

        <div class="divider">OR</div>

        <a href="https://discord.com/oauth2/authorize?client_id=1500902919166234844&response_type=code&redirect_uri=http%3A%2F%2Flocalhost%3A3000&scope=identify" class="btn btn-discord" id="login" style="text-decoration: none;">
            <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="white" xmlns="http://www.w3.org/2000/svg" class="bi bi-discord">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96,46,95.89,53,90.84,65.69,84.69,65.69Z"/>
            </svg>
            Login with Discord

        </a>

        <a href="https://accounts.google.com/o/oauth2/v2/auth?client_id=229496207804-lkd1fe1f04alt9ls525elipj6pk72q6v.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A3000&response_type=code&scope=email%20profile"
           class="btn btn-google" style="text-decoration: none; background-color: #DB4437; color: white; display: flex; justify-content: center; align-items: center;">
            Login with Google
        </a>

    </form>
</div>
<div id="register-container" class="register-container">
    <h2>Register</h2>
    <form id="registerForm">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label for="registerUsername">Username</label>
            <input type="text" id="registerUsername" name="registerUsername" placeholder="Enter your username" required>
        </div>
        <div class="input-group">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" name="registerPassword" placeholder="Enter your password" required>
        </div>
        <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
        </div>
        <button type="submit" class="btn btn-login">Register</button>
        <button id="backToLoginBtn" type="button" class="btn btn-register">Back to Login</button>
    </form>
</div>
</body>
</html>
