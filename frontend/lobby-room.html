<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plafin - Lobby Room</title>
  <link href="dashboard.css" rel="stylesheet">
  <link href="lobby-room.css" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <script src="lobby-room.js" defer></script>
</head>

<div class="sidebar">
  <div class="logo">PLAFIN</div>
  <div class="menu">
    <a href="/dashboard" class="nav-btn"><span class="icon icon-grid"></span></a>
    <a href="/lobbies.html" class="nav-btn"><span class="icon icon-controller"></span></a>
    <a href="#" class="nav-btn active" style="color: #4CAF50;"><span class="icon icon-profile"></span></a>
  </div>
  <button id="logoutBtn" class="logout-btn"><span class="icon icon-logout"></span></button>
</div>

<div class="main-content room-layout">
  <div class="chat-section">
    <div class="chat-messages" id="chatMessages">
    </div>
    <form id="chatForm" class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Hier die Nachricht fürs Senden" autocomplete="off" required>
      <button type="submit" class="btn-send">Send</button>
    </form>
  </div>

  <div class="info-section">
    <div class="room-info-header">
      <h2 id="roomTitle">Loading...</h2>
      <button id="updateLobby" class="btn-edit" style="display: none;">
        <span class="icon icon-settings"></span>
      </button>
    </div>
    <div class="player-count-box">
      <span>Player</span>
      <span id="roomPlayerCount">0/0</span>
    </div>

    <div class="online-list">
      <h3>Online:</h3>
      <ul id="memberList">
      </ul>
    </div>

    <button id="leaveLobbyBtn" class="btn-leave">Leave Lobby</button>
  </div>
</div>
<div id="editModal" class="modal-overlay" style="display: none;">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Edit Lobby</h2>
      <button id="closeEditModal" class="close-modal-btn">&times;</button>
    </div>

    <form id="editLobbyForm">
      <div class="form-group">
        <label for="editTitle">Titel</label>
        <input type="text" id="editTitle" placeholder="Titel">
      </div>
      <div class="form-group">
        <label for="editMaxPlayers">Max Players</label>
        <input type="number" id="editMaxPlayers" min="2" max="64">
      </div>

      <div class="form-group">
        <label for="editDescription">Lobby Description</label>
        <textarea id="editDescription" rows="3"></textarea>
      </div>

      <button type="submit" class="btn-create-submit">Save Changes</button>
    </form>
  </div>
</div>
</body>
</html>
