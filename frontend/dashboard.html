<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plafin - Dashboard</title>
    <link href="dashboard.css" rel="stylesheet">
    <script src="dashboard.js" defer></script>
</head>
<body>
<div class="sidebar">
    <div class="logo">PLAFIN</div>

    <div class="menu">
        <button class="nav-btn active">
            <span class="icon icon-grid"></span>
        </button>

        <a href="/lobbies.html" class="nav-btn" style="text-decoration: none;">
            <span class="icon icon-controller"></span>
        </a>
    </div>

    <a href="#" id="activeLobbyBtn" class="nav-btn" style="display: none; color: #4CAF50;">
        <span class="icon icon-profile"></span> <!-- Kannst du später durch ein Chat-Icon ersetzen -->
    </a>

    <button id="logoutBtn" class="logout-btn">
        <span class="icon icon-logout"></span>
    </button>
</div>

<div class="main-content">
    <header>
        <h1 id="info">Game Selection</h1>
        <div class="header-icons">

            <span class="icon icon-settings icon-hover"></span>

            <div class="user-profile">
                <span class="icon icon-profile icon-hover" style="width: 32px; height: 32px;"></span>
            </div>

        </div>
    </header>

    <div class="game-grid" id="gameGrid">
    </div>
</div>
<div id="settingsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <div style="background: #2b2b36; padding: 20px; border-radius: 8px; color: white; min-width: 300px;">
        <h2>Settings</h2>

        <div id="settingsDefaultView">
            <div id="passwordSettingsSection">
                <button id="changePasswordViewBtn" style="display: block; width: 100%; margin-bottom: 10px;">Passwort ändern</button>
            </div>

            <div id="usernameSettingsSection">
                <button id="changeUsernameViewBtn" style="display: block; width: 100%; margin-bottom: 10px;">Username ändern</button>
            </div>

            <button id="deleteAccountBtn" style="background-color: #DB4437; color: white; display: block; width: 100%;">Account löschen</button>
            <br>
            <button id="closeModalBtn" style="width: 100%;">Schließen</button>
        </div>

        <div id="settingsPasswordView" style="display: none;">
            <h3>Passwort ändern</h3>
            <input type="password" id="oldPassword" placeholder="Altes Passwort" style="display: block; width: 100%; margin-bottom: 5px;">
            <input type="password" id="newPassword" placeholder="Neues Passwort" style="display: block; width: 100%; margin-bottom: 5px;">
            <input type="password" id="confirmNewPassword" placeholder="Wiederholen" style="display: block; width: 100%; margin-bottom: 10px;">
            <button id="savePasswordBtn">Speichern</button>
            <button onclick="document.getElementById('settingsPasswordView').style.display='none'; document.getElementById('settingsDefaultView').style.display='block';">Zurück</button>
        </div>

        <div id="settingsUsernameView" style="display: none;">
            <h3>Username ändern</h3>
            <input type="text" id="newUsernameInput" placeholder="Neuer Benutzername" style="display: block; width: 100%; margin-bottom: 10px;">
            <button id="saveUsernameBtn">Speichern</button>
            <button onclick="document.getElementById('settingsUsernameView').style.display='none'; document.getElementById('settingsDefaultView').style.display='block';">Zurück</button>
        </div>
    </div>
</div>
<div id="profileModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1001;">
    <div style="background: #2b2b36; padding: 20px; border-radius: 8px; color: white; min-width: 300px; text-align: center;">
        <h2 id="profileUsername">Hello, User!</h2>
        <p id="profileLoginInfo" style="color: #aaa;"></p>
        <button onclick="document.getElementById('profileModal').style.display='none';" style="width: 100%; margin-top: 15px;">Schließen</button>
    </div>
</div>
</body>
</html>
